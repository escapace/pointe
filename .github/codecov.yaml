comment: false
github_checks:
  annotations: true

coverage:
  precision: 2
  range: '20...60'
  round: down
  status:
    changes: false
    patch:
      default:
        informational: true
    project:
      default:
        target: auto
        threshold: 5%

flags:
  plugin-index-html:
    paths:
      - packages/plugin-index-html/
  plugin-write-assets:
    paths:
      - packages/plugin-write-assets/
  pointe:
    paths:
      - packages/pointe/
  types:
    paths:
      - packages/types/
